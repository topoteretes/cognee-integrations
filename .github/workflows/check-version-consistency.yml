name: Check Version Consistency

on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/inventory.yml'
      - 'integrations/**/plugin.json'
      - 'integrations/*/package.json'
      - '.claude-plugin/marketplace.json'
      - 'scripts/check_version_consistency.py'
      - 'scripts/tests/test_version_consistency.py'
      - '.github/workflows/check-version-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/inventory.yml'
      - 'integrations/**/plugin.json'
      - 'integrations/*/package.json'
      - '.claude-plugin/marketplace.json'
      - 'scripts/check_version_consistency.py'
      - 'scripts/tests/test_version_consistency.py'
      - '.github/workflows/check-version-consistency.yml'

permissions:
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test version guard
        run: python -m unittest discover -s scripts/tests -v
      - name: Check release metadata
        run: python scripts/check_version_consistency.py
