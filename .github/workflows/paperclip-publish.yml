# Publishes the Paperclip company-memory plugin (integrations/paperclip) to npm
# on tag push, with npm provenance (OIDC). Configure the package on npmjs.com for
# trusted publishing from this repository and workflow, or add NPM_TOKEN as a
# repository secret as a fallback.
#
# Release flow:
#   1. Bump the version in package.json, package-lock.json, src/version.ts
#      (the manifest reads it), CHANGELOG.md and integrations/inventory.yml
#      (tests/version.test.mjs and scripts/check_version_consistency.py enforce
#      agreement).
#   2. Tag: git tag paperclip-v<version> && git push --tags

name: Publish paperclip plugin to npm

on:
  push:
    tags:
      - "paperclip-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
      contents: read
    defaults:
      run:
        working-directory: integrations/paperclip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#paperclip-v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag says $tag_version but package.json says $pkg_version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Inspect the tarball
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          for required in dist/manifest.js dist/worker.js migrations/001_memory_ledger.sql skills/company-memory/SKILL.md README.md COMPATIBILITY.md CHANGELOG.md; do
            grep -q " $required$" pack.log || { echo "missing $required from the tarball" >&2; exit 1; }
          done
          ! grep -qE " (tests/|fixtures/|node_modules/|\.env)" pack.log
          # No monorepo-relative imports may survive bundling.
          ! grep -qE "integrations/(lovable|mastra|openclaw|opencode)" dist/worker.js

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
