# Publishes the Lovable memory connector (integrations/lovable) to npm on tag
# push, with npm provenance (OIDC). No long-lived npm token in the workflow;
# configure the package on npmjs.com for trusted publishing from this repository
# and workflow file, or add NPM_TOKEN as a repository secret as a fallback.
#
# Release flow:
#   1. Bump the version in package.json, package-lock.json, src/version.ts,
#      CHANGELOG.md and integrations/inventory.yml (tests/version.test.mjs and
#      scripts/check_version_consistency.py enforce agreement).
#   2. Tag: git tag lovable-v<version> && git push --tags

name: Publish lovable connector to npm

on:
  push:
    tags:
      - "lovable-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
      contents: read
    defaults:
      run:
        working-directory: integrations/lovable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#lovable-v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag says $tag_version but package.json says $pkg_version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Inspect the tarball
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          for required in dist/index.js dist/src/operator-cli.js README.md COMPATIBILITY.md CHANGELOG.md deploy/Dockerfile examples/project-knowledge.txt; do
            grep -q " $required$" pack.log || { echo "missing $required from the tarball" >&2; exit 1; }
          done
          ! grep -qE " (tests/|fixtures/|node_modules/|\.env)" pack.log

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
