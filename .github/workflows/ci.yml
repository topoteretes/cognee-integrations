name: Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/**'
      - '.github/workflows/ci.yml'
      - '.github/core-team.txt'
  push:
    branches: [main]
    paths:
      - 'integrations/**'
      - '.github/workflows/ci.yml'
      - '.github/core-team.txt'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.classify.outputs.python }}
      typescript: ${{ steps.classify.outputs.typescript }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect and classify changed integrations
        id: classify
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi

          # Find changed integration directories (exclude dotfiles like inventory.yml edits)
          CHANGED_DIRS=$(git diff --name-only "$BASE" HEAD -- integrations/ \
            | grep -E '^integrations/[^/]+/' \
            | cut -d/ -f2 | sort -u || true)

          PY_LIST=""
          TS_LIST=""
          RUN_SHARED=""

          for dir in $CHANGED_DIRS; do
            [ ! -d "integrations/$dir" ] && continue
            # claude-code, codex, and antigravity have no pyproject of their own; their shared
            # pytest suite lives in integrations/tests and must run when they change.
            case "$dir" in
              claude-code|codex|antigravity|tests) RUN_SHARED=1 ;;
            esac
            if [ -f "integrations/$dir/pyproject.toml" ]; then
              PY_LIST="${PY_LIST}\"${dir}\","
            elif [ -f "integrations/$dir/package.json" ]; then
              TS_LIST="${TS_LIST}\"${dir}\","
            fi
          done

          if [ -n "$RUN_SHARED" ]; then
            case "$PY_LIST" in
              *'"tests"'*) ;;  # already included (integrations/tests itself changed)
              *) PY_LIST="${PY_LIST}\"tests\"," ;;
            esac
          fi

          # Build JSON arrays
          if [ -n "$PY_LIST" ]; then
            echo "python=[${PY_LIST%,}]" >> "$GITHUB_OUTPUT"
          else
            echo "python=[]" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$TS_LIST" ]; then
            echo "typescript=[${TS_LIST%,}]" >> "$GITHUB_OUTPUT"
          else
            echo "typescript=[]" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed dirs: $CHANGED_DIRS"

  test-python:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.python != '[]' }}
    runs-on: ubuntu-latest
    # A hung suite otherwise runs to GitHub's 6h default before anyone hears
    # about it. The longest real cell is a cold `uv sync` of the cognee stack
    # plus its tests, which lands around 5m.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        integration: ${{ fromJSON(needs.detect-changes.outputs.python) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "integrations/${{ matrix.integration }}/.python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: integrations/${{ matrix.integration }}
        run: uv sync --locked --dev

      - name: Run tests
        working-directory: integrations/${{ matrix.integration }}
        run: uv run pytest tests/ -v

  # The hook-based plugins (claude-code, codex, antigravity) must run under the
  # oldest python3 users commonly have on PATH — macOS's Xcode Command Line Tools
  # ship 3.9.6 — because the hooks run under it before (and, in cloud mode,
  # instead of) the plugin's own uv-managed 3.12 venv. A `X | None` annotation
  # without `from __future__ import annotations` breaks every hook at import time
  # on 3.9 and nothing else catches it (SDK-617). The shared suite's pyproject
  # pins 3.10+ for its own tooling, so this cell builds an ad-hoc 3.9 environment.
  test-hooks-python39:
    needs: detect-changes
    if: ${{ contains(needs.detect-changes.outputs.python, '"tests"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Run the shared hook suite on Python 3.9
        working-directory: integrations/tests
        run: >-
          uv run --no-project --python 3.9
          --with "pytest>=8" --with "pytest-httpserver>=1.0"
          pytest tests/unit tests/integration tests/e2e -q

  test-typescript:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.typescript != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        integration: ${{ fromJSON(needs.detect-changes.outputs.typescript) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # n8n's dev toolchain (@n8n/node-cli -> n8n-workflow 2.x -> @n8n/expression-runtime)
      # pulls in isolated-vm 7, a native module that requires Node >= 24 and compiles
      # from source at install time. Node 20 fails that compile, so n8n gets Node 24
      # (the version n8n 2.x itself requires); the other integrations stay on 20.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.integration == 'n8n' && '24' || '20' }}

      - name: Build local dependencies
        if: matrix.integration == 'openclaw-skills'
        working-directory: integrations/openclaw
        run: npm install && npm run build

      - name: Install dependencies
        working-directory: integrations/${{ matrix.integration }}
        run: npm install

      # Until this existed the TypeScript job type-checked and stopped, so every
      # TS test in the repo was decorative — openclaw alone had 128 passing tests
      # that no CI job ever ran.
      #
      # --if-present: integrations without a test script, such as vellum-assistant,
      # must not fail for lacking one.
      # --passWithNoTests: openclaw-skills HAS a jest script but no test files, and
      # bare `jest` exits 1 on "no tests found". Both jest and vitest accept the
      # flag, so it works across the matrix.
      - name: Test
        working-directory: integrations/${{ matrix.integration }}
        run: |
          case "${{ matrix.integration }}" in
            n8n|opencode) npm test --if-present ;;
            *) npm test --if-present -- --passWithNoTests ;;
          esac

      - name: Type check
        working-directory: integrations/${{ matrix.integration }}
        run: npx tsc --noEmit --skipLibCheck

  # ── Advisory Claude Code review — pulls the private skill from cognee-ci at runtime ──
  # Rubric + Slack map live in the private cognee-ci repo; this job carries no review logic.
  # Runs after the integration tests settle (skips tolerated; never on a test failure),
  # core-team PRs only, advisory (continue-on-error — never blocks a merge).
  claude-review:
    name: Claude Code Review
    timeout-minutes: 15
    needs: [ detect-changes, test-python, test-hooks-python39, test-typescript ]
    if: >-
      ${{ !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && needs.detect-changes.result == 'success'
          && needs.test-python.result != 'failure'
          && needs.test-hooks-python39.result != 'failure'
          && needs.test-typescript.result != 'failure' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Core-team gate
        id: gate
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          author_lc="$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')"
          if grep -vE '^[[:space:]]*#' .github/core-team.txt \
               | sed 's/^@//' | tr '[:upper:]' '[:lower:]' | grep -qxF "$author_lc"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PR author '$AUTHOR' not in core-team.txt — skipping."
          fi

      - name: Mint private-repo token
        if: ${{ steps.gate.outputs.run == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cognee-ci

      - name: Fetch private review skill + slack map
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cognee-ci
          token: ${{ steps.app-token.outputs.token }}
          path: .ci-private

      - name: Stage skill into the user skills dir
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          # Stage into the USER skills dir ($HOME/.claude), NOT the repo's .claude/.
          # claude-code-action sanitizes the repo .claude for untrusted PR heads
          # (it moves the working-tree .claude to .claude-pr/ and restores a clean
          # .claude from the base branch), which wipes the staged private skill and
          # leaves /pr-review unresolved -> 0 turns, nothing posted. $HOME/.claude is
          # untouched by that sanitization and is loaded via settingSources: [user,...].
          mkdir -p "$HOME/.claude/skills"
          cp -r .ci-private/.claude/skills/pr-review "$HOME/.claude/skills/"

      - name: Claude Code review
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/pr-review"
          claude_args: >-
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --max-turns 50
            --model claude-sonnet-4-5-20250929

      - name: DM review summary to PR author on Slack
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: python3 .ci-private/scripts/pr_review_slack_notify.py
