name: Live E2E (real backends, no mocks)

# Deliberately NOT on pull_request. These tiers spend real credits and write to a
# real graph, so they must never gate a merge or run on an untrusted head.
# Nightly plus on-demand is enough to catch regressions in the memory chain that
# the hermetic suite cannot see.
#
# Two jobs, ONE test suite. The same 36 scenarios run against a locally booted
# server and against a cloud tenant; the backend is chosen by a single env var
# (COGNEE_LIVE_BASE_URL). Separate jobs rather than one, so a cloud outage cannot
# discredit the local signal — and because they need different setup: the local
# job builds/caches the plugin venv, the cloud job needs no venv at all.
on:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: 'Extra pytest args (e.g. -k shared_brain)'
        required: false
        default: ''
  schedule:
    # 04:20 UTC daily — off-peak, and after the day's merges have settled.
    - cron: '20 4 * * *'

concurrency:
  # One live run at a time: concurrent runs would race on the cached plugin venv,
  # and two cloud runs would wipe each other's datasets mid-flight.
  group: live-e2e
  cancel-in-progress: false

jobs:
  local:
    name: live tier (local server)
    runs-on: ubuntu-latest
    # A failure here fails the run. These tiers are not on pull_request, so this
    # gates nothing — it only decides whether a nightly regression is visible or
    # silent, and silent is the worse failure mode. The known product gaps are
    # strict xfails rather than allowed failures, so they are already green;
    # anything that goes red here is genuinely new.
    continue-on-error: false
    # Every scenario runs against both integrations: ~24m30s locally with a
    # seeded venv, and a cache-miss run also pays the full plugin-venv build
    # before any test.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: integrations/tests/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # The plugin builds its own venv (uv + a pinned cognee) on first
      # SessionStart, which takes minutes. Locally the harness symlinks the
      # developer's; in CI there is none, so cache it across runs instead.
      # COGNEE_LIVE_ALLOW_BUILD lets the first (cache-miss) run build it.
      - name: Cache the plugin runtime venv
        uses: actions/cache@v4
        with:
          path: ~/.cognee-plugin/venv
          key: cognee-plugin-venv-${{ runner.os }}-${{ hashFiles('integrations/claude-code/scripts/session-start.py') }}
          restore-keys: |
            cognee-plugin-venv-${{ runner.os }}-

      - name: Install test dependencies
        working-directory: integrations/tests
        run: uv sync --locked --dev

      - name: Run the live tier against a locally booted server
        working-directory: integrations/tests
        env:
          COGNEE_RUN_LIVE: '1'
          COGNEE_LIVE_ALLOW_BUILD: '1'
          LLM_API_KEY: ${{ secrets.LIVE_E2E_LLM_API_KEY }}
          # Keep cognify cheap; the agent side is simulated, so this is the only
          # model spend in the run.
          LLM_MODEL: openai/gpt-4o-mini
        run: |
          if [ -z "${LLM_API_KEY}" ]; then
            echo "::error::LIVE_E2E_LLM_API_KEY is not set — the local live tier cannot run."
            exit 1
          fi
          uv run pytest tests/e2e/live -m live -v ${{ inputs.pytest_args }}

      # A live failure is only actionable with the plugin's own logs, and the
      # temp HOMEs are gone by the time anyone looks at the run.
      - name: Collect plugin logs on failure
        if: failure()
        run: |
          echo "### hook logs from temp HOMEs" >> "$GITHUB_STEP_SUMMARY"
          find /tmp /var/folders -name 'hook.log' -path '*cognee-plugin*' 2>/dev/null | while read -r f; do
            echo "--- $f" >> "$GITHUB_STEP_SUMMARY"
            tail -80 "$f" >> "$GITHUB_STEP_SUMMARY"
          done

  cloud:
    name: live tier (cloud tenant)
    runs-on: ubuntu-latest
    continue-on-error: false
    # No venv to build and no server to boot, so this is the fast half: the hooks
    # talk to the tenant over stdlib HTTP and never import cognee.
    timeout-minutes: 45
    # Independent of the local job on purpose: a cloud outage should not hide a
    # local regression, and vice versa. Both still serialise via `concurrency`.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: integrations/tests/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install test dependencies
        working-directory: integrations/tests
        run: uv sync --locked --dev

      # No plugin-venv cache step here by design. `ensure_cognee_ready` returns
      # after an HTTP /health check when a base_url is set — the `import cognee`
      # sits in the local-SDK branch below it — so the cloud backend needs no
      # runtime venv, and `live_home` skips seeding one.
      - name: Run the live tier against the cloud tenant
        working-directory: integrations/tests
        env:
          COGNEE_RUN_LIVE: '1'
          # Setting this is what selects the cloud backend for the whole tier.
          COGNEE_LIVE_BASE_URL: ${{ secrets.CLOUD_COGNEE_BASE_URL }}
          COGNEE_LIVE_API_KEY: ${{ secrets.CLOUD_COGNEE_API_KEY }}
        run: |
          if [ -z "${COGNEE_LIVE_BASE_URL}" ] || [ -z "${COGNEE_LIVE_API_KEY}" ]; then
            echo "::error::CLOUD_COGNEE_BASE_URL / CLOUD_COGNEE_API_KEY are not set — the cloud live tier cannot run."
            exit 1
          fi
          # No LLM_API_KEY: cognify runs server-side on the tenant, so the run
          # never uses one. The 8 server-killing scenarios are auto-deselected.
          uv run pytest tests/e2e/live -m live -v ${{ inputs.pytest_args }}

      - name: Collect plugin logs on failure
        if: failure()
        run: |
          echo "### hook logs from temp HOMEs (cloud backend)" >> "$GITHUB_STEP_SUMMARY"
          find /tmp /var/folders -name 'hook.log' -path '*cognee-plugin*' 2>/dev/null | while read -r f; do
            echo "--- $f" >> "$GITHUB_STEP_SUMMARY"
            tail -80 "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      # The tier wipes the tenant either side of the run, but a cancelled or
      # timed-out job never reaches its teardown. This is the backstop; the next
      # run's pre-wipe is the other one.
      - name: Wipe the tenant if the run was cut short
        if: cancelled() || failure()
        working-directory: integrations/tests
        env:
          COGNEE_LIVE_BASE_URL: ${{ secrets.CLOUD_COGNEE_BASE_URL }}
          COGNEE_LIVE_API_KEY: ${{ secrets.CLOUD_COGNEE_API_KEY }}
        run: |
          uv run python -c "
          from utils.live import cloud_api_key, cloud_base_url, delete_test_datasets
          url = cloud_base_url()
          if not url:
              print('no tenant configured')
          else:
              deleted, failures = delete_test_datasets(url, cloud_api_key())
              print(f'cleanup: deleted {deleted} test dataset(s); failures={failures[:5]}')
          "
