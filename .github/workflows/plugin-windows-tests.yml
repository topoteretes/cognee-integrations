name: Plugin Windows Tests

# The claude-code and codex plugins carry genuinely platform-specific paths:
# _proc.py (Windows liveness via OpenProcess/WaitForSingleObject, process
# ancestry via CreateToolhelp32Snapshot), a status-line renderer whose stdio
# encoding is Windows-sensitive (cp1252 cannot encode the health glyphs), and
# state directories resolved from USERPROFILE rather than HOME. None of that is
# exercised by the ubuntu-only matrix in ci.yml, so the shared suite runs again
# here on a real Windows runner.
#
# This runs the SAME suite as ci.yml (integrations/tests), not a hand-listed set
# of scripts. The previous version invoked five files directly as
# `python <file>`, which meant those files ran only on Windows and never on
# Linux, and that any test added to the shared suite was silently never checked
# on Windows at all.

on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/claude-code/**'
      - 'integrations/codex/**'
      - 'integrations/tests/**'
      - '.github/workflows/plugin-windows-tests.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/claude-code/**'
      - 'integrations/codex/**'
      - 'integrations/tests/**'
      - '.github/workflows/plugin-windows-tests.yml'

jobs:
  test-plugins-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # The repo has deeply-nested committed artifacts (n8n_workflows LanceDB
      # files) whose paths exceed Windows' MAX_PATH; sparse-checkout the trees
      # this job needs and allow long paths so checkout cannot break.
      - name: Allow long paths for checkout
        run: git config --global core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # integrations/tests holds the shared suite; the other two hold the
          # hook scripts it imports and runs as subprocesses.
          sparse-checkout: |
            integrations/claude-code
            integrations/codex
            integrations/tests

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: integrations/tests/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: integrations/tests
        run: uv sync --locked --dev

      # The suite's addopts already exclude the live tier (`-m 'not live'`), so
      # this never needs a server or an LLM key. Tests that encode POSIX-only
      # semantics (file mode bits) skip themselves via `os.name == "nt"`.
      - name: Run the shared suite
        working-directory: integrations/tests
        run: uv run pytest tests/ -v
