[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognee-integration-tapes-cassette"
version = "0.1.0"
description = "Cognee as a tapes cassette — proxied memory sync + search over recorded agent sessions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cognee team" }]
dependencies = [
    "cognee>=0.5.1,<0.6.0",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
cognee-tapes-cassette = "cognee_integration_tapes_cassette.server:main"

[project.urls]
Homepage = "https://github.com/topoteretes/cognee-integrations/tree/main/integrations/tapes-cassette"
Repository = "https://github.com/topoteretes/cognee-integrations"

[tool.setuptools.packages.find]
where = ["."]
include = ["cognee_integration_tapes_cassette*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.6",
]
