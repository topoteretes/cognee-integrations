<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cognee inspector</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2a2e36; --text: #e6e8ec; --dim: #8b93a1;
    --plugin: #6ea8fe; --server: #b392f0; --enola: #f0b35a; --run: #57c7a3; --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 12px 20px; }
  h1 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
  .status { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .status b { color: var(--text); font-weight: 500; }
  .bad { color: var(--error) !important; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type=text], select { background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; }
  input[type=text] { width: 260px; }
  label.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer; user-select: none; }
  label.chip input { accent-color: var(--plugin); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .plugin .dot, .dot.plugin { background: var(--plugin); }
  .server .dot, .dot.server { background: var(--server); }
  .enola .dot, .dot.enola { background: var(--enola); }
  .run .dot, .dot.run { background: var(--run); }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  main { padding: 6px 20px 40px; }
  .row { display: grid; grid-template-columns: 78px 70px 84px 1fr; gap: 10px; padding: 5px 6px;
         border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; }
  .row:hover { background: var(--panel); }
  .time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .src { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .title { overflow-wrap: anywhere; }
  .row.error .title { color: var(--error); }
  .sess { color: var(--dim); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap;
          background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  .sess:hover { color: var(--text); text-decoration: underline; }
  .sess.none { cursor: default; opacity: .45; }
  .sess.none:hover { color: var(--dim); text-decoration: none; }
  .day { color: var(--dim); font-size: 12px; padding: 14px 6px 4px; text-transform: uppercase;
         letter-spacing: .04em; }
  pre { grid-column: 1 / -1; margin: 4px 0 6px; padding: 10px 12px; background: #101216;
        border: 1px solid var(--line); border-radius: 6px; overflow-x: auto;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfd4dc; }
  table.stages { grid-column: 1 / -1; border-collapse: collapse; margin: 4px 0 8px; font-size: 12px; }
  table.stages td { padding: 2px 12px 2px 0; color: var(--dim); }
  table.stages td.s-completed { color: var(--run); }
  table.stages td.s-errored { color: var(--error); }
  table.stages td.name { color: var(--text); }
  .empty { color: var(--dim); padding: 30px 6px; }
</style>
</head>
<body>
<header>
  <h1>Cognee inspector</h1>
  <div class="status" id="status">Loading…</div>
  <div class="controls">
    <input type="text" id="q" placeholder="Filter text (event, file, error…)" aria-label="Filter text">
    <select id="session" aria-label="Session"><option value="">All sessions</option></select>
    <label class="chip plugin"><input type="checkbox" data-src="plugin" checked><span class="dot"></span>Plugin hooks</label>
    <label class="chip run"><input type="checkbox" data-src="run" checked><span class="dot"></span>Server runs</label>
    <label class="chip enola"><input type="checkbox" data-src="enola" checked><span class="dot"></span>enola</label>
    <label class="chip server"><input type="checkbox" data-src="server" checked><span class="dot"></span>Server log</label>
    <label class="chip"><input type="checkbox" id="errors">Errors only</label>
    <label class="chip"><input type="checkbox" id="quiet" checked>Hide routine events</label>
    <button id="pause">Pause</button>
  </div>
</header>
<main id="list"><div class="empty">Loading…</div></main>
<script>
const ROUTINE = /^(store_session_key|mode_decision|prompt_session_key|context_lookup_session_key|sync_session_key|sync_payload|runtime_state_|state_sweep|observer_skipped|exit_watcher_started|bootstrap_|endpoint_mode_selected|final_sync_once|sync_start_delayed|sync_detached)/;
let data = { events: [] }, paused = false, open = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const local = ts => { const d = new Date(ts + "Z"); return isNaN(d) ? ts : d; };

function render() {
  const q = $("q").value.trim().toLowerCase(), session = $("session").value;
  const sources = new Set([...document.querySelectorAll("[data-src]")].filter(c => c.checked).map(c => c.dataset.src));
  const errorsOnly = $("errors").checked, quiet = $("quiet").checked;
  const rows = data.events.filter(e =>
    sources.has(e.source) &&
    (!session || e.session === session) &&
    (!errorsOnly || e.level === "error") &&
    (!quiet || e.source !== "plugin" || e.level === "error" || !ROUTINE.test(e.title)) &&
    (!q || (e.title + " " + JSON.stringify(e.detail || {})).toLowerCase().includes(q)));
  let html = "", day = "";
  rows.forEach((e, i) => {
    const d = local(e.ts), key = e.ts + "|" + e.source + "|" + e.title;
    const dayLabel = d instanceof Date ? d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) : "";
    if (dayLabel !== day) { day = dayLabel; html += `<div class="day">${esc(day)}</div>`; }
    const time = d instanceof Date ? d.toLocaleTimeString([], { hour12: false }) : e.ts;
    html += `<div class="row ${e.level === "error" ? "error" : ""}" data-key="${esc(key)}">
      <span class="time">${esc(time)}</span>
      <span class="src"><span class="dot ${e.source}"></span> ${esc(e.source)}</span>
      ${e.session
        ? `<button class="sess" data-session="${esc(e.session)}" title="${esc(e.session)} (click to show only this session)">${esc(e.session.slice(0, 8))}</button>`
        : `<span class="sess none" title="This event names no session">–</span>`}
      <span class="title">${esc(e.title)}</span>`;
    if (open.has(key)) {
      if (e.stages) {
        html += `<table class="stages">` + e.stages.map(s =>
          `<tr><td class="name">${esc(s.stage)}</td><td class="s-${esc(s.status)}">${esc(s.status)}</td><td>${esc(s.reason || "")}</td><td>${esc(JSON.stringify(s.counts || ""))}</td><td>${s.duration_ms != null ? esc(s.duration_ms) + " ms" : ""}</td><td>${esc(s.error || "")}</td></tr>`).join("") + `</table>`;
      }
      html += `<pre>${e.session ? "session: " + esc(e.session) + "\n" : ""}${esc(JSON.stringify(e.detail, null, 2))}</pre>`;
    }
    html += `</div>`;
  });
  $("list").innerHTML = html || `<div class="empty">Nothing matches. Clear the filters, or run something in Claude Code.</div>`;
}

function fillSessions() {
  const current = $("session").value, seen = new Map();
  data.events.forEach(e => { if (e.session && !seen.has(e.session)) seen.set(e.session, e.ts); });
  $("session").innerHTML = `<option value="">All sessions</option>` + [...seen].slice(0, 40).map(([id, ts]) => {
    const d = local(ts);
    return `<option value="${esc(id)}">${esc(id.slice(0, 8))} · last ${d instanceof Date ? esc(d.toLocaleTimeString([], { hour12: false })) : ""}</option>`;
  }).join("");
  $("session").value = seen.has(current) ? current : "";
}

async function refresh() {
  if (paused) return;
  try {
    data = await (await fetch("/api/events")).json();
    const h = data.health || {}, ok = h.status === "ready";
    const caps = (h.capabilities || []).includes("coding_distillation_v1") ? "coding mode on" : "coding mode not reported";
    $("status").innerHTML = `Server <b>${esc(data.server)}</b>: <b class="${ok ? "" : "bad"}">${esc(h.status || "?")}</b>` +
      (ok ? ` · ${esc(h.version || "")} · ${caps}` : "") +
      (data.runs_error ? ` · <span class="bad">runs not loaded: ${esc(data.runs_error)}</span>` : "") +
      ` · ${data.events.length} events · updated ${new Date().toLocaleTimeString([], { hour12: false })}`;
    fillSessions(); render();
  } catch (error) {
    $("status").innerHTML = `<span class="bad">Inspector server not reachable.</span>`;
  }
}

$("list").addEventListener("click", ev => {
  if (window.getSelection().toString()) return;
  const pick = ev.target.closest("[data-session]");
  if (pick) { const select = $("session"); select.value = select.value === pick.dataset.session ? "" : pick.dataset.session; render(); return; }
  const row = ev.target.closest(".row"); if (!row) return;
  const key = row.dataset.key; open.has(key) ? open.delete(key) : open.add(key); render();
});
["q", "session", "errors", "quiet"].forEach(id => $(id).addEventListener("input", render));
document.querySelectorAll("[data-src]").forEach(c => c.addEventListener("input", render));
$("pause").addEventListener("click", () => { paused = !paused; $("pause").textContent = paused ? "Resume" : "Pause"; if (!paused) refresh(); });
refresh(); setInterval(refresh, 2500);
</script>
</body>
</html>
