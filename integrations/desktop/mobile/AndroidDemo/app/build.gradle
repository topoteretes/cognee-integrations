plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.cognee.demo'
    compileSdk 34

    defaultConfig {
        applicationId "ai.cognee.demo"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
// no dependencies: platform TextViews + org.json + HttpURLConnection only
