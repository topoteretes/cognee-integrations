[project]
name = "cognee-integration-backend-core"
version = "0.1.0"
description = "Standardized cognee access layer for integrations: local / HTTP / fake adapters, one contract, hardened runtime posture"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only for the in-process LocalCogneeAdapter; HTTP and fake adapters are network/stdlib only.
local = ["cognee>=1.1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_backend_core"]
