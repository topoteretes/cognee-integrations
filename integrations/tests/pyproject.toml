[project]
name = "cognee-integrations-shared-tests"
version = "0.1.0"
description = "Shared test harness for the claude-code and codex Cognee integrations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
# Test-only project: nothing to build or install.
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpserver>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The same basename may appear in more than one tier (e.g. a module's wire tests
# in integration/ and its pure-logic tests in unit/). importlib mode drops the
# unique-basename requirement of the legacy prepend mode.
addopts = "--import-mode=importlib"
