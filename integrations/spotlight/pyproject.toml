[project]
name = "cognee-spotlight-backend"
version = "0.1.0"
description = "Local search backend for the Cognee Spotlight macOS app (cognee local, cognee cloud, or fake mode)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "cognee-integration-backend-core",
]

[tool.uv.sources]
cognee-integration-backend-core = { path = "../backend-core", editable = true }

[project.optional-dependencies]
# Only needed for COGNEE_MODE=local (in-process cognee). Cloud and fake modes are HTTP/stdlib only.
local = ["cognee>=1.1.0"]
# Office/rich-document loaders (.docx, .pptx, .rtf, .xlsx, ...) for local mode.
docs = ["cognee[docs]>=1.1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotlight_backend"]
