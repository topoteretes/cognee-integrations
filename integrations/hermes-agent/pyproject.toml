[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognee-integration-hermes-agent"
version = "1.1.0"
description = "Standalone Cognee memory provider plugin for Hermes Agent."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Cognee team"}
]
dependencies = [
    "cognee>=1.2.1,<=1.4.0",
]

[project.entry-points."hermes_agent.plugins"]
cognee = "cognee_integration_hermes"

[project.scripts]
# Hermes discovers plugins by directory scan, not entry points — this copies
# the installed package into $HERMES_HOME/plugins/cognee. See installer.py.
cognee-hermes-install = "cognee_integration_hermes.installer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cognee_integration_hermes*"]

[tool.setuptools.package-data]
# The plugin-root files (plugin.yaml, cli.py shim, after-install.md) that the
# installer lays down next to the package. Kept byte-identical to the repo-root
# canonical copies by tests/test_installer.py.
cognee_integration_hermes = ["_plugin_root/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.14.6",
]

[tool.pytest.ini_options]
# Without a pytest section here, rootdir resolution walks up to the monorepo
# root's pyproject.toml and this suite adopts its `asyncio_mode = "auto"` — an
# option pytest-asyncio owns and hermes does not install, so every run, local
# and CI alike, printed a PytestConfigWarning about it.
testpaths = ["tests"]

# A hung run is the failure mode this suite was reported for (SDK-454), and a
# hang has no natural bound: a socket that never answers or a child that is
# never reaped just sits there until CI's 6h default gives up. The slowest
# honest test here is the exit-watcher's ~2s poll, so 60s only ever fires on a
# genuine hang — and fires as a named, stack-dumping failure instead of silence.
timeout = 60
