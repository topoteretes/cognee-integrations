name: cognee
kind: exclusive
version: 1.3.0
description: "Cognee memory provider for Hermes Agent: session-aware graph memory, recall, forget, and session-end improvement."
pip_dependencies:
  # Exact pin: the installed package doubles as the local server this plugin
  # spawns. 1.5.4 is the floor — code-graph indexing moved its repo-spec form
  # field to raw_data there; content_type="code", the "code" recall scope and
  # targeted session invalidation on document delete first shipped in 1.5.3 —
  # and 1.6.0 is what the plugin is written against: the password-less default
  # user and the only_context prompt contract.
  - cognee==1.6.0
hooks:
  - on_session_end
  - on_memory_write
